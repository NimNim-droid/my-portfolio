<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Squircle Dark Container -->
  <rect width="64" height="64" rx="16" fill="#0c0c0c" />
  
  <!-- N Letter -->
  <text 
    x="32" 
    y="27" 
    font-family="'Archivo Black', 'Arial Black', sans-serif" 
    font-size="24" 
    font-weight="900" 
